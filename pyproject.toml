[build-system]
# torch is intentionally absent: the HIP kernels must be built against the ROCm
# PyTorch already installed in the target environment, which the in-tree
# backend makes visible to the isolated build (see build_backend/backend.py).
requires = ["setuptools>=64", "ninja"]
build-backend = "backend"
backend-path = ["build_backend"]

[project]
name = "mini-dpvo"
version = "0.1.1"
description = "Miniature version of DPVO, focused on inference (ROCm/HIP build)"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
]
# torch must be a ROCm build installed before this package, since the HIP
# kernels compile against it (setup.py refuses anything else). Install it from
# https://download.pytorch.org/whl/rocm7.14 first; pip then leaves it alone.
# lietorch is the ROCm fork (PyPI's `lietorch` is an unrelated CUDA build) and
# is built against that same torch, so install with --no-build-isolation.
dependencies = [
    "torch",
    "torchvision",
    "lietorch @ git+https://github.com/gandres42/lietorch.git",
    "numpy",
    "matplotlib",
    "scipy",
    "tqdm",
    "yacs>=0.1.8",
    "jaxtyping>=0.2.28",
    "opencv-python>=4.9.0.80",
    "mmcv-lite>=2.2.0,<3",
    "huggingface_hub",
    "mini-dust3r>=0.1.1,<0.2",
    # gradio-rerun's frontend bundle only loads on the Gradio release it was
    # built for, and it pins rerun-sdk; keep these three in lockstep.
    "gradio==6.30.0",
    "gradio-rerun==0.38.1",
    "rerun-sdk==0.38.1",
]

[project.optional-dependencies]
eval = ["evo>=1.28.0"]

[project.scripts]
mini-dpvo-app = "mini_dpvo.gradio_ui.dpvo_ui:main"

[tool.setuptools.packages.find]
include = ["mini_dpvo", "mini_dpvo.*"]

[tool.setuptools.package-data]
mini_dpvo = ["configs/*.yaml"]

[tool.ruff.lint]
ignore = [
    "F722", # Forward annotation false positive from jaxtyping. Should be caught by pyright.
]
